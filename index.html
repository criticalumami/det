let mode = "arch"; // "arch" | "all" | "credits"
let sortCol = "";
let sortAsc = true;

const qInput = document.getElementById("q");
const roleSelect = document.getElementById("f-role");
const countrySelect = document.getElementById("f-country");
const issueSelect = document.getElementById("f-issue");
const tbody = document.getElementById("tbody");
const theadRow = document.getElementById("thead-row");
const countInfo = document.getElementById("count-info");

const COLS_OFFICE = [
  { key: "Office / Practice Name", label: "office" },
  { key: "Primary Discipline", label: "discipline" },
  { key: "City", label: "city" },
  { key: "Country", label: "country" },
  { key: "Website", label: "web" },
  { key: "Suggested Contact Email", label: "mail" },
  { key: "Key Architects / Project Leads", label: "architects / leads" },
  { key: "Featured Projects", label: "project(s)" },
  { key: "Project Locations / Addresses", label: "location / address" },
  { key: "Magazine Issues", label: "issue(s)" }
];

const COLS_CREDITS = [
  { key: "Office / Practice Name", label: "office" },
  { key: "Discipline / Role", label: "discipline" },
  { key: "Office City", label: "city" },
  { key: "Country", label: "country" },
  { key: "Website", label: "web" },
  { key: "Suggested Contact Email", label: "mail" },
  { key: "Project Lead / Architects", label: "architects / leads" },
  { key: "Featured Project", label: "project" },
  { key: "Project Address / Location", label: "project address" },
  { key: "Magazine Issue", label: "issue" }
];

function getActiveDataset() {
  if (mode === "credits") return DB.credits;
  if (mode === "all") return DB.offices;
  return DB.offices.filter(r => {
    const d = r["Primary Discipline"] || "";
    return d.includes("Architecture") || d.includes("Interior") || d.includes("Urban");
  });
}

function getActiveCols() {
  return mode === "credits" ? COLS_CREDITS : COLS_OFFICE;
}

function populateFilters() {
  const rows = getActiveDataset();
  const roleKey = mode === "credits" ? "Discipline / Role" : "Primary Discipline";
  const issueKey = mode === "credits" ? "Magazine Issue" : "Magazine Issues";

  const roles = new Set();
  const countries = new Set();
  const issues = new Set();

  for (const r of rows) {
    if (r[roleKey]) roles.add(r[roleKey]);
    if (r["Country"]) countries.add(r["Country"]);
    const issVal = r[issueKey] || "";
    for (const part of issVal.split(",")) {
      const m = part.trim().match(/^(DETAIL_\d{4}_[0-9\-]+)/);
      if (m) issues.add(m[1]);
    }
  }

  const prevRole = roleSelect.value;
  const prevCountry = countrySelect.value;
  const prevIssue = issueSelect.value;

  roleSelect.innerHTML = '<option value="">all disciplines</option>' +
    Array.from(roles).sort().map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join("");
  countrySelect.innerHTML = '<option value="">all countries</option>' +
    Array.from(countries).sort().map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join("");
  issueSelect.innerHTML = '<option value="">all issues</option>' +
    Array.from(issues).sort().map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join("");

  if (roles.has(prevRole)) roleSelect.value = prevRole;
  if (countries.has(prevCountry)) countrySelect.value = prevCountry;
  if (issues.has(prevIssue)) issueSelect.value = prevIssue;
}

function esc(s) {
  return String(s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function renderHeader() {
  const cols = getActiveCols();
  theadRow.innerHTML = cols.map(c => {
    const arrow = sortCol === c.key ? (sortAsc ? " ▲" : " ▼") : "";
    return `<th data-key="${esc(c.key)}">${esc(c.label)}${arrow}</th>`;
  }).join("");
}

function renderTable() {
  const cols = getActiveCols();
  const rawRows = getActiveDataset();
  const q = qInput.value.trim().toLowerCase();
  const fRole = roleSelect.value;
  const fCountry = countrySelect.value;
  const fIssue = issueSelect.value;

  const roleKey = mode === "credits" ? "Discipline / Role" : "Primary Discipline";
  const issueKey = mode === "credits" ? "Magazine Issue" : "Magazine Issues";

  let filtered = rawRows.filter(r => {
    if (fRole && r[roleKey] !== fRole) return false;
    if (fCountry && r["Country"] !== fCountry) return false;
    if (fIssue && !(r[issueKey] || "").includes(fIssue)) return false;
    if (q) {
      const hay = Object.values(r).join(" ").toLowerCase();
      for (const token of q.split(/\s+/)) {
        if (token && !hay.includes(token)) return false;
      }
    }
    return true;
  });

  if (sortCol) {
    filtered.sort((a, b) => {
      const va = String(a[sortCol] || "").toLowerCase();
      const vb = String(b[sortCol] || "").toLowerCase();
      if (va < vb) return sortAsc ? -1 : 1;
      if (va > vb) return sortAsc ? 1 : -1;
      return 0;
    });
  }

  countInfo.textContent = `showing ${filtered.length} of ${rawRows.length} rows`;

  const html = filtered.map(r => {
    const cells = cols.map((c, idx) => {
      const val = r[c.key] || "";
      if (idx === 0) {
        return `<th>${esc(val)}</th>`;
      }
      if (c.key === "Website" && val) {
        const short = val.replace(/^https?:\/\/(www\.)?/, "");
        return `<td class="nowrap"><a href="${esc(val)}" target="_blank" rel="noopener">${esc(short)}</a></td>`;
      }
      if (c.key === "Suggested Contact Email" && val) {
        return `<td class="nowrap"><a href="mailto:${esc(val)}">${esc(val)}</a></td>`;
      }
      if (c.key === "Magazine Issue" && r["Magazine Page"]) {
        return `<td class="nowrap">${esc(val)} (p.${esc(r["Magazine Page"])})</td>`;
      }
      return `<td>${esc(val)}</td>`;
    }).join("");
    return `<tr>${cells}</tr>`;
  }).join("");

  tbody.innerHTML = html;
}

function setMode(newMode) {
  mode = newMode;
  document.getElementById("btn-arch").classList.toggle("active", mode === "arch");
  document.getElementById("btn-all").classList.toggle("active", mode === "all");
  document.getElementById("btn-credits").classList.toggle("active", mode === "credits");
  sortCol = "";
  populateFilters();
  renderHeader();
  renderTable();
}

document.getElementById("btn-arch").addEventListener("click", () => setMode("arch"));
document.getElementById("btn-all").addEventListener("click", () => setMode("all"));
document.getElementById("btn-credits").addEventListener("click", () => setMode("credits"));

document.getElementById("btn-reset").addEventListener("click", () => {
  qInput.value = "";
  roleSelect.value = "";
  countrySelect.value = "";
  issueSelect.value = "";
  sortCol = "";
  renderHeader();
  renderTable();
});

qInput.addEventListener("input", renderTable);
roleSelect.addEventListener("change", renderTable);
countrySelect.addEventListener("change", renderTable);
issueSelect.addEventListener("change", renderTable);

theadRow.addEventListener("click", e => {
  const th = e.target.closest("th");
  if (!th) return;
  const key = th.dataset.key;
  if (sortCol === key) {
    sortAsc = !sortAsc;
  } else {
    sortCol = key;
    sortAsc = true;
  }
  renderHeader();
  renderTable();
});

window.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== qInput) {
    e.preventDefault();
    qInput.focus();
    qInput.select();
  } else if (e.key === "Escape" && document.activeElement === qInput) {
    qInput.blur();
  }
});

populateFilters();
renderHeader();
renderTable();
</script>
